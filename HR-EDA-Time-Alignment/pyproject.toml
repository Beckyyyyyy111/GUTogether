[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-emotibit-viewer"
version = "0.1.0"
description = "Live, time-aligned HR/EDA viewer for two EmotiBit devices over LSL"
requires-python = ">=3.10"
dependencies = [
    "pylsl>=1.16.2",
    "pyqtgraph>=0.13.7",
    "PyQt5>=5.15.10",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.scripts]
dual-emotibit-viewer = "dual_emotibit_viewer.app:main"
emotibit-combine-csv = "dual_emotibit_viewer.offline.combine_csv:main"
emotibit-view-recording = "dual_emotibit_viewer.offline.view_recording:main"

[tool.setuptools.packages.find]
where = ["src"]
